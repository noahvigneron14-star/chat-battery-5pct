<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chat Violet — Batterie ≤10%</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <section id="locked" class="card">
      <h1>🔋 Accès restreint</h1>
      <p id="battery-text">Lecture du niveau de batterie…</p>
      <p class="muted">Le chat n'est accessible que si la batterie est ≤ 10%.</p>
      <div class="controls">
        <input id="name" placeholder="Ton pseudo (optionnel)" maxlength="30">
        <button id="force" class="btn">Forcer accès (test)</button>
        <button id="retry" class="btn alt hidden">Réessayer</button>
      </div>
    </section>

    <section id="content" class="card hidden" aria-hidden="true">
      <header class="chat-header">
        <h2>Chat violet</h2>
        <p id="final-info" class="muted">Chat actif — batterie masquée aux autres si indisponible.</p>
      </header>

      <div id="chat" class="chat">
        <ul id="messages"></ul>
        <form id="form" autocomplete="off">
          <input id="msg-name" placeholder="Ton pseudo (optionnel)" maxlength="30" />
          <input id="input" placeholder="Écris un message..." maxlength="500" autocomplete="off" />
          <button class="send">Envoyer</button>
        </form>
      </div>

      <button id="logout" class="btn alt">Quitter</button>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
